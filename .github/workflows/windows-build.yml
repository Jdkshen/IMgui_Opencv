name: Windows Build

on:
  push:
    branches: [ main, master, "codex/**" ]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".claude/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".claude/**"
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: microsoft/setup-msbuild@v3
      - name: Build application
        run: msbuild Windows_imgui.vcxproj /t:Build /p:Configuration=Release /p:Platform=x64 /m:1 /nologo
      - name: Build regression tests
        run: msbuild Test\RegressionTests.vcxproj /t:Build /p:Configuration=Release /p:Platform=x64 /m:1 /nologo
      - name: Run full regression tests
        shell: pwsh
        run: |
          $output = & .\Test\x64\Release\RegressionTests.exe 2>&1
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($exitCode -ne 0) {
            $tail = ($output | Select-Object -Last 30) -join "`n"
            $tail = $tail.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
            Write-Output "::error title=Regression tests failed::$tail"
            exit $exitCode
          }
      - name: Package runtime
        shell: pwsh
        run: .\scripts\package_runtime.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: IMgui-Opencv-runtime
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0
